scenario_set_version: '2.0'
evaluation_target: api_v1_recommendation_pipeline
top_three_threshold: 0.9
scenarios:
- scenario_id: R01_INSURANCE_ACTIVATION
  kind: relevance
  student_need: Activate international student health-insurance coverage.
  intake:
    category_id: insurance
    need_type: booking_steps
    query: activate international health insurance IHI coverage
    student_type: international_student
    jurisdiction: mcgill
    urgency_level: routine
    language: en
  expected_status: matched
  expected_categories:
  - insurance
  acceptable_targets:
  - host: www.mcgill.ca
    path_prefix: /internationalstudents/health
    title_contains_any:
    - activate
    - coverage
    - IHI
  must_include_source_link: true
  must_include_limitation: true
  acceptable_service_types:
  - official source-grounded service navigation
  pass_rule: At least one acceptable target must appear in the top three source pages.
