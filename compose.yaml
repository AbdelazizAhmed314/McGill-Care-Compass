services:
  care-compass:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: internal
      CORS_ORIGINS: http://127.0.0.1:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MCC_LLM_MODEL: ${MCC_LLM_MODEL:-}
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
